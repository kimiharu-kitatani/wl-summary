<script>
const $=id=>document.getElementById(id);

let D=[],REQ={},VIS=[],EXT=false,BUSY=false;const SEL=new Set();let PRI=LS(PK,{});
fetch('../data/detail_requests.json',{cache:'no-cache'}).then(r=>r.ok?r.json():{}).then(j=>{REQ=j||{};render()}).catch(()=>{});

 const del=new Set(LS(DK,[])),ids=new Set(d.map(x=>x.videoId));[...del].forEach(i=>{if(!ids.has(i)||d.find(x=>x.videoId===i&&x.removed))del.delete(i)});localStorage.setItem(DK,JSON.stringify([...del]));

 .catch(()=>$('list').innerHTML='<p class="n">data.json を読み込めませんでした</p>');
function card(x){const id=x.videoId,p=PRI[id]||0;
 return `<div class="c${SEL.has(id)?' sel':''}${x.removed?' rm':''}" data-id="${esc(id)}">
 <a href="${esc(x.url)}" target="_blank" rel="noopener"><img loading="lazy" src="${esc(x.thumbnail)}" alt=""></a><div class="b">
 ${x.removed?`<span class="rmb">削除済み${x.removed_at?'（'+esc(new Date(x.removed_at).toLocaleDateString('ja-JP',{timeZone:'Asia/Tokyo'}))+'）':''}</span>`:''}<div class="hd"><label class="ckw" title="選択"><input type="checkbox" class="ck" data-id="${esc(id)}"${SEL.has(id)?' checked':''} aria-label="選択"></label><a class="t" href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a></div>
 <div class="m"><span>${esc(x.channel)}${x.duration?' ・ '+esc(x.duration):''}${x.upload_date?' ・ 投稿 '+esc(x.upload_date):''}</span>
 <span title="優先度（もう一度押すと解除）">${[1,2,3].map(n=>`<button class="pri${p>=n?' on':''}" data-id="${esc(id)}" data-n="${n}" aria-label="優先度${n}">★</button>`).join('')}</span></div>
 ${x.summary_ja?`<div class="s">${esc(x.summary_ja)}</div>${x.points&&x.points.length?'<ul>'+x.points.map(q=>'<li>'+esc(q)+'</li>').join('')+'</ul>':''}`
 :`<div class="n">${x.captions==='no_captions'?'字幕がないため要約できません':'要約はまだありません'}</div>`}
 ${x.detail?`<details><summary>詳しい要約を読む</summary><div>${esc(x.detail).replace(/\n/g,'<br>')}</div></details>`:REQ[id]?'<span class="badge">詳しい要約をリクエスト済み</span>':''}
 </div></div>`}
function render(){const q=$('q').value.toLowerCase(),c=$('ch').value,fv=$('f').value,so=$('sort').value;
 const av=$('arc').value;let r=D.filter(x=>(av==='all'||(av==='only'?x.removed:!x.removed))&&(!c||x.channel===c)&&(!fv||(fv==='y'&&x.summary_ja)||(fv==='n'&&!x.summary_ja)||(fv==='d'&&x.detail)||(fv==='p'&&PRI[x.videoId]))&&
  (!q||[x.title,x.channel,x.summary_ja,x.detail,...(x.points||[])].join(' ').toLowerCase().includes(q)));
 const up=x=>x.upload_date||'';
 const cmp={wl:(a,b)=>a.wl_index-b.wl_index,wlr:(a,b)=>b.wl_index-a.wl_index,
  up:(a,b)=>(up(b).localeCompare(up(a)))||(a.wl_index-b.wl_index),upr:(a,b)=>(!up(a)-!up(b))||up(a).localeCompare(up(b))||(a.wl_index-b.wl_index),
  pri:(a,b)=>((PRI[b.videoId]||0)-(PRI[a.videoId]||0))||(a.wl_index-b.wl_index)}[so];
 r.sort(cmp);VIS=r;
 const nd=so.startsWith('up')?r.filter(x=>!x.upload_date).length:0;
 const na=D.filter(x=>x.removed).length;$('cnt').textContent=`${r.length} / ${D.length-na} 件`+(na?`（削除済み ${na} 件は${av?'表示中':'非表示'}）`:'')+(nd?`（投稿日不明 ${nd} 件は末尾）`:'');
 if($('grp').checked){const g=new Map();r.forEach(x=>{const k=x.channel||'（チャンネル不明）';g.has(k)||g.set(k,[]);g.get(k).push(x)});
  $('list').innerHTML=[...g].sort((a,b)=>b[1].length-a[1].length||a[0].localeCompare(b[0],'ja')).map(([k,v])=>`<h2 class="grp">${esc(k)} <span>${v.length}件</span></h2><div class="grid">${v.map(card).join('')}</div>`).join('')}
 else $('list').innerHTML=`<div class="grid">${r.map(card).join('')}</div>`;
 updBar()}
function updBar(){const n=SEL.size;$('del').textContent=`選んだ${n}件を後で見るから削除`;
 $('det').textContent=EXT?`選んだ${n}件の詳しい要約を作成`:`選んだ${n}件の詳しい要約をリクエスト（GitHub）`;
 $('del').disabled=!EXT||BUSY||!n;$('det').disabled=BUSY||!n;$('cp').disabled=!n;$('all').disabled=BUSY;
 $('all').checked=VIS.length>0&&VIS.every(x=>SEL.has(x.videoId));
 const st=$('st');
 if(BUSY){st.textContent='';st.className=''}
 else if(!EXT&&CHECKING){st.textContent='拡張機能を確認中…';st.className=''}
 else if(!EXT){st.textContent='⚠ 拡張機能が見つかりません（削除はPCのChrome＋拡張機能v2.4以上が必要）';st.className='ng'}
 else if(!n){st.textContent=`✔ 拡張機能 v${EXTV||'?'} 接続中 ・ 動画を選ぶとボタンが押せます`;st.className='ok'}
 else{st.textContent=`✔ 拡張機能 v${EXTV||'?'} 接続中`;st.className='ok'}}
['q','ch','f','sort','grp','arc'].forEach(i=>$(i).addEventListener('input',render));
$('list').addEventListener('change',e=>{if(!e.target.classList.contains('ck'))return;const id=e.target.dataset.id;
 e.target.checked?SEL.add(id):SEL.delete(id);e.target.closest('.c').classList.toggle('sel',e.target.checked);$('note').textContent='';updBar()});
$('list').addEventListener('click',e=>{const b=e.target.closest('.pri');if(!b)return;const id=b.dataset.id,n=+b.dataset.n;
 PRI[id]=PRI[id]===n?0:n;if(!PRI[id])delete PRI[id];localStorage.setItem(PK,JSON.stringify(PRI));render()});
$('all').addEventListener('change',()=>{VIS.forEach(x=>$('all').checked?SEL.add(x.videoId):SEL.delete(x.videoId));render()});
// ---- 拡張機能との連携（ハンドシェイクは再試行＋拡張側からの名乗りでも有効化） ----
const ORIGIN=location.origin;let done=0,total=0;
let EXTV='',CHECKING=true;function setExt(v){if(v)EXTV=v;if(EXT){updBar();return}EXT=true;CHECKING=false;$('note').textContent='';updBar()}
window.addEventListener('message',e=>{if(e.source!==window||e.origin!==ORIGIN||!e.data)return;const m=e.data;
 if(m.type==='WL_PONG'||m.type==='WL_EXT_READY')setExt(m.version);
 if(m.type==='WL_DELETE_PROGRESS'){
  if(m.id){const c=document.querySelector(`.c[data-id="${m.id}"] .b`);if(c){let p=c.querySelector('.pr');if(!p){p=document.createElement('div');p.className='pr';c.appendChild(p)}
   p.textContent=m.ok?'✅ 削除しました':'❌ 削除失敗: '+(m.error||'');p.style.color=m.ok?'#080':'#c00'}
   if(m.ok){const s=new Set(LS(DK,[]));s.add(m.id);localStorage.setItem(DK,JSON.stringify([...s]));SEL.delete(m.id)}done++;$('note').textContent=`削除中… ${done}/${total}`}
  if(m.done){BUSY=false;const s=new Set(LS(DK,[]));D.forEach(x=>{if(s.has(x.videoId)&&!x.removed)Object.assign(x,{removed:true,removed_at:new Date().toISOString()})});
   $('note').textContent=m.error?'エラー: '+m.error:`完了: ${(m.removed||[]).length}/${total} 件削除${m.commit?'（'+m.commit+'）':''}`;setTimeout(render,1500)}}
 if(m.type==='WL_DETAIL_RESULT'){BUSY=false;
  if(m.ok){(m.ids||[]).forEach(id=>{REQ[id]=REQ[id]||{requestedAt:new Date().toISOString()};SEL.delete(id)});render();$('note').textContent=`詳しい要約のリクエストを ${(m.ids||[]).length} 件記録しました`}
  else{$('note').textContent='リクエストの記録に失敗: '+(m.error||'');updBar()}}});
$('del').addEventListener('click',()=>{const rmd=new Set(D.filter(x=>x.removed).map(x=>x.videoId));const ids=[...SEL].filter(i=>!rmd.has(i));if(!ids.length){$('note').textContent='選んだ動画はすべて削除済みです';return}
 if(!confirm(`選んだ${ids.length}件をYouTubeの「後で見る」から削除します。よろしいですか？`))return;
 BUSY=true;done=0;total=ids.length;$('note').textContent=`削除中… 0/${total}`;updBar();window.postMessage({type:'WL_DELETE',ids},ORIGIN)});
$('det').addEventListener('click',()=>{const ids=[...SEL];if(!ids.length)return;
 if(!EXT){const ti=D.filter(x=>SEL.has(x.videoId)).map(x=>`- ${x.videoId} ${x.title}`).join('\n');
  const body=`詳しい要約を作成してください。\n\n${ti}\n\n<!-- ids: ${ids.join(',')} -->`;
  const url='https://github.com/kimiharu-kitatani/wl-summary/issues/new?title='+encodeURIComponent(`詳しい要約のリクエスト（${ids.length}件）`)+'&labels=detail-request&body='+encodeURIComponent(body);
  if(url.length>7000){navigator.clipboard?.writeText(ids.join('\n'));$('note').textContent='件数が多いためIDをコピーしました。開いたIssueに貼り付けてください';window.open('https://github.com/kimiharu-kitatani/wl-summary/issues/new?title='+encodeURIComponent('詳しい要約のリクエスト'),'_blank','noopener')}
  else{window.open(url,'_blank','noopener');$('note').textContent='GitHubのIssue画面を開きました。「Create」を押すとリクエストになります'}
  return}
 if(!confirm(`選んだ${ids.length}件の詳しい要約をリクエストします（GitHubに記録し、あとでBotが作成します）。よろしいですか？`))return;
 BUSY=true;$('note').textContent='リクエストを記録中…';updBar();window.postMessage({type:'WL_DETAIL_REQUEST',ids},ORIGIN)});
$('cp').addEventListener('click',async()=>{const ids=[...SEL].join('\n');try{await navigator.clipboard.writeText(ids);$('note').textContent=`${SEL.size}件のIDをコピーしました`}catch{prompt('IDをコピーしてください',ids)}});
let tries=0;const ping=setInterval(()=>{if(EXT||++tries>30){clearInterval(ping);CHECKING=false;updBar()}else window.postMessage({type:'WL_PING'},ORIGIN)},500);
updBar();
window.postMessage({type:'WL_PING'},ORIGIN);
</script></body></html>
