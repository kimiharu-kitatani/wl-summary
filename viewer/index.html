<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>後で見る 要約一覧</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Hiragino Sans","Noto Sans JP",sans-serif;background:#f5f5f5;color:#222}
header{position:sticky;top:0;background:#fff;padding:10px;box-shadow:0 1px 4px #0002;z-index:1}
h1{font-size:18px;margin:0 0 8px}.ctl{display:flex;gap:6px;flex-wrap:wrap}
input,select{padding:8px;font-size:15px;border:1px solid #ccc;border-radius:6px}input{flex:1;min-width:160px}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;padding:12px;max-width:1400px;margin:auto}
.c{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 3px #0002;display:flex;flex-direction:column}
.c img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}.b{padding:10px}
.t{font-weight:600;font-size:15px;color:#111;text-decoration:none}.m{font-size:12px;color:#666;margin:4px 0}
.s{font-size:14px;line-height:1.6}ul{padding-left:18px;margin:6px 0;font-size:13px}.n{color:#999;font-size:13px}#cnt{font-size:12px;color:#666;margin-top:6px}
</style></head><body><header><h1>後で見る 要約一覧</h1><div class="ctl">
<input id="q" type="search" placeholder="タイトル・チャンネル・要約を検索">
<select id="ch"><option value="">すべてのチャンネル</option></select>
<select id="f"><option value="">すべて</option><option value="y">要約あり</option><option value="n">要約なし</option></select>
</div><div id="cnt"></div></header><main id="list"></main><script>
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let D=[];fetch('../data/data.json',{cache:'no-cache'}).then(r=>r.json()).then(d=>{D=d;
 [...new Set(d.map(x=>x.channel).filter(Boolean))].sort().forEach(c=>ch.add(new Option(c,c)));render()})
 .catch(()=>list.innerHTML='<p class="n">data.json を読み込めませんでした</p>');
function render(){const q=document.getElementById('q').value.toLowerCase(),c=ch.value,fv=f.value;
 const r=D.filter(x=>(!c||x.channel===c)&&(!fv||(fv==='y')===!!x.summary_ja)&&
  (!q||[x.title,x.channel,x.summary_ja,...(x.points||[])].join(' ').toLowerCase().includes(q)));
 cnt.textContent=`${r.length} / ${D.length} 件`;
 list.innerHTML=r.map(x=>`<div class="c"><a href="${esc(x.url)}" target="_blank" rel="noopener"><img loading="lazy" src="${esc(x.thumbnail)}" alt=""></a><div class="b">
 <a class="t" href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a><div class="m">${esc(x.channel)}${x.duration?' ・ '+esc(x.duration):''}</div>
 ${x.summary_ja?`<div class="s">${esc(x.summary_ja)}</div>${x.points&&x.points.length?'<ul>'+x.points.map(p=>'<li>'+esc(p)+'</li>').join('')+'</ul>':''}`
 :`<div class="n">${x.captions==='no_captions'?'字幕がないため要約できません':'要約はまだありません'}</div>`}</div></div>`).join('')}
['q','ch','f'].forEach(i=>document.getElementById(i).addEventListener('input',render));
</script></body></html>
